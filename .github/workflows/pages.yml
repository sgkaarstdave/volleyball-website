name: Deploy RallyBoard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
      - uses: actions/configure-pages@v5
      - run: |
          mkdir _site
          cp index.html app.mjs model.mjs cloud.mjs analytics.mjs stats.mjs dashboard.mjs schedule.mjs schedule-data.mjs wvv-parser.mjs access.mjs viewer-ui.mjs match-ui.mjs club-logo.png style.css sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
