<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a30"><title>RallyBoard</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="RallyBoard"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf0fc;background:#0b1221}*{box-sizing:border-box}body{margin:0}header{padding:20px 16px;background:#111e35;position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 12px}small,.muted{color:#99aac5}main{padding:16px;max-width:680px;margin:auto;padding-bottom:100px}.card{background:#16233a;border:1px solid #2c3b55;border-radius:16px;padding:15px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.five{grid-template-columns:repeat(5,1fr)}.tile{background:#23334e;border-radius:12px;padding:10px 4px;text-align:center;min-width:0}.tile b{font-size:25px;display:block;margin:5px 0}.tile span{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis}button{border:0;background:#4b8bf5;color:white;padding:12px;border-radius:10px;font-weight:700;cursor:pointer;min-height:42px}button:active{transform:scale(.98)}.tile button{width:90%;padding:9px 3px}button.secondary{background:#31445f}input,select{width:100%;background:#263750;color:white;border:1px solid #435775;padding:11px;border-radius:10px;font-size:16px}label{display:block;font-size:12px;color:#aebdd3;margin:8px 0 4px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.row>*{min-width:0}nav{position:fixed;bottom:0;left:0;right:0;background:#111e35;display:flex;padding:8px 8px max(10px,env(safe-area-inset-bottom));gap:6px;z-index:4}nav button{flex:1;font-size:12px;background:transparent;color:#aabbd5}nav button.sel{background:#31548a;color:white}.hidden{display:none}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #30415c}.pill{font-size:12px;color:#83e1b3} .wide{width:100%;margin-top:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}</style></head><body><header><div><h1>🏐 RallyBoard</h1><small>SG Kaarst · Matchday</small></div><span id="status" class="pill">● Lokal gespeichert</span></header><main id="app"></main><nav id="nav"></nav><script>
const roster=['Rayan','Cedric','Slawa','Jan','Lukas','David','Devin','Lionel'];const positions=['4','3','5','6','2'];const cats=['Kill','Ass','Blockpunkt','Gute Annahme','Gute Abwehr','Gute Sicherung','Annahme/Abwehr-Fehler','Angabefehler','Sicherungsfehler','Angriffsfehler'];const weights=[3,3,3,1,1,1,-2,-2,-1,-2];
const seed=()=>({players:[...roster],matches:[],current:null,tab:'live',undo:[]});let db;try{db=JSON.parse(localStorage.getItem('rallyboard-v1'))||seed()}catch(e){db=seed()}let tab=db.tab||'live';function save(){db.tab=tab;try{localStorage.setItem('rallyboard-v1',JSON.stringify(db));document.getElementById('status').textContent='● Lokal gespeichert'}catch(e){document.getElementById('status').textContent='⚠ Speicher prüfen'}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function current(){return db.matches.find(m=>m.id===db.current)}function newMatch(){const opponent=document.getElementById('opponent').value.trim()||'Gegner offen';const date=document.getElementById('date').value||new Date().toISOString().slice(0,10);const m={id:Date.now().toString(),opponent,date,sets:[{pos:{},actions:{},subs:[],active:db.players.slice(0,6),score:['','']}],done:false};db.matches.unshift(m);db.current=m.id;tab='live';save();render()}function set(){const m=current();return m?.sets[m.sets.length-1]}function addPos(p){const s=set();if(!s)return;s.pos[p]=(s.pos[p]||0)+1;db.undo.push({kind:'pos',p});save();render()}function addAction(n,c){const s=set();if(!s)return;s.actions[n]??={};s.actions[n][c]=(s.actions[n][c]||0)+1;db.undo.push({kind:'act',n,c});save();render()}function undo(){const h=db.undo.pop(),s=set();if(!h||!s)return;if(h.kind==='pos')s.pos[h.p]=Math.max(0,(s.pos[h.p]||0)-1);if(h.kind==='act')s.actions[h.n][h.c]=Math.max(0,(s.actions[h.n][h.c]||0)-1);save();render()}function sub(){const s=set(),out=document.getElementById('out').value,inn=document.getElementById('in').value;if(!out||!inn||s.active.includes(inn))return;s.active=s.active.map(n=>n===out?inn:n);s.subs.push(out+' → '+inn);save();render()}function nextSet(){const m=current();if(!m)return;m.sets.push({pos:{},actions:{},subs:[],active:[...set().active],score:['','']});db.undo=[];save();render()}function endMatch(){const m=current();if(!m)return;m.done=true;db.current=null;db.undo=[];tab='matches';save();render()}function stats(m){let pos={},actions={};for(const s of m.sets){for(const [p,n] of Object.entries(s.pos))pos[p]=(pos[p]||0)+n;for(const [name,cs] of Object.entries(s.actions)){actions[name]??={};for(const [c,n] of Object.entries(cs))actions[name][c]=(actions[name][c]||0)+n}}return{pos,actions}}function score(a){return Object.entries(a).reduce((v,[c,n])=>v+(weights[cats.indexOf(c)]||0)*n,0)}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='rallyboard-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.matches)||!Array.isArray(x.players))throw Error('Format');if(confirm('Aktuelle Daten durch Backup ersetzen?')){db=x;save();render()}}catch(e){alert('Ungültiges Backup')}};r.readAsText(f)}function selectMatch(id){db.current=id;db.undo=[];tab='live';save();render()}function addPlayer(){const x=document.getElementById('playerName').value.trim();if(x&&!db.players.includes(x)){db.players.push(x);save();render()}}function live(){const m=current();if(!m)return '<section class="card"><h2>Neuen Spieltag starten</h2><label>Gegner</label><input id="opponent" placeholder="z. B. TG Neuss"><label>Datum</label><input type="date" id="date" value="'+new Date().toISOString().slice(0,10)+'"><button class="wide" onclick="newMatch()">Spiel starten</button></section><p class="muted">Oder unter Spieltage eine bestehende Partie öffnen.</p>';const s=set();let html='<section class="card"><div class="row"><div><h2>'+esc(m.opponent)+'</h2><small>'+esc(m.date)+' · Satz '+m.sets.length+'</small></div><button class="secondary" onclick="undo()">↶ Undo</button></div></section><section class="card"><h2>Zuspiele nach Position</h2><div class="grid five">'+positions.map(p=>'<div class="tile"><span>Pos '+p+'</span><b>'+(s.pos[p]||0)+'</b><button onclick="addPos(\''+p+'\')">+1</button></div>').join('')+'</div></section><section class="card"><h2>Spieleraktionen</h2><label>Aktion auswählen</label><select id="action" onchange="renderActions()">'+cats.map((c,i)=>'<option value="'+i+'">'+esc(c)+'</option>').join('')+'</select><div id="actions"></div><button class="wide secondary" onclick="document.getElementById(\'subPanel\').classList.toggle(\'hidden\')">⇄ Auswechslung</button><div id="subPanel" class="hidden"><div class="two"><div><label>Raus</label><select id="out">'+s.active.map(n=>'<option>'+esc(n)+'</option>').join('')+'</select></div><div><label>Rein</label><select id="in">'+db.players.filter(n=>!s.active.includes(n)).map(n=>'<option>'+esc(n)+'</option>').join('')+'</select></div></div><button class="wide" onclick="sub()">Wechsel bestätigen</button></div></section><section class="card"><h2>Satz abschließen</h2><div class="two"><div><label>Unsere Punkte</label><input id="homeScore" type="number" min="0" value="'+esc(s.score[0])+'"></div><div><label>Gegner</label><input id="awayScore" type="number" min="0" value="'+esc(s.score[1])+'"></div></div><button class="wide" onclick="setScore()">Ergebnis speichern</button><button class="wide" onclick="nextSet()">Nächsten Satz starten</button><button class="wide secondary" onclick="if(confirm(\'Spieltag beenden?\'))endMatch()">Spieltag beenden</button></section>';return html}function setScore(){const s=set();s.score=[document.getElementById('homeScore').value,document.getElementById('awayScore').value];save();render()}function renderActions(){const s=set(),c=cats[Number(document.getElementById('action').value)];document.getElementById('actions').innerHTML='<div class="grid" style="margin-top:12px">'+s.active.map(n=>'<div class="tile"><span>'+esc(n)+'</span><b>'+(s.actions[n]?.[c]||0)+'</b><button onclick="addAction(\''+esc(n).replace(/'/g,'\\\'')+'\',\''+esc(c)+'\')">+1</button></div>').join('')+'</div>'}function matches(){return '<section class="card"><h2>Spieltage</h2>'+db.matches.map(m=>'<div class="stat"><div><b>'+esc(m.opponent)+'</b><br><small>'+esc(m.date)+' · '+m.sets.length+' Sätze · '+(m.done?'Beendet':'Laufend')+'</small></div><button onclick="selectMatch(\''+m.id+'\')">Öffnen</button></div>').join('')+'</section><section class="card"><h2>Neues Spiel</h2><label>Gegner</label><input id="opponent" placeholder="Gegner"><label>Datum</label><input type="date" id="date" value="'+new Date().toISOString().slice(0,10)+'"><button class="wide" onclick="newMatch()">Anlegen</button></section>'}function statistics(){let totals={},p={};for(const m of db.matches){const s=stats(m);for(const [n,a] of Object.entries(s.actions)){totals[n]??={};for(const [c,v] of Object.entries(a))totals[n][c]=(totals[n][c]||0)+v}for(const [x,v] of Object.entries(s.pos))p[x]=(p[x]||0)+v}const rank=Object.entries(totals).map(([n,a])=>({n,pts:score(a),kills:a.Kill||0})).sort((a,b)=>b.pts-a.pts);return '<section class="card"><h2>Gesamtstatistik</h2><div class="stat"><span>Spieltage</span><b>'+db.matches.length+'</b></div>'+positions.map(x=>'<div class="stat"><span>Zuspiele Pos '+x+'</span><b>'+(p[x]||0)+'</b></div>').join('')+'</section><section class="card"><h2>MVP-Ranking <small>(gewichtete Aktionen)</small></h2>'+rank.map((r,i)=>'<div class="stat"><span>'+(i+1)+'. '+esc(r.n)+' <small>· '+r.kills+' Kills</small></span><b>'+r.pts+' Pkt.</b></div>').join('')+'<p class="muted">Wertung: Kill/Ass/Block +3; gute Annahme/Abwehr/Sicherung +1; Fehler −1 oder −2. Nur erfasste Aktionen.</p></section>'}function settings(){return '<section class="card"><h2>Kader</h2>'+db.players.map(n=>'<div class="stat">'+esc(n)+'</div>').join('')+'<label>Neuer Spieler</label><input id="playerName" placeholder="Name"><button class="wide" onclick="addPlayer()">Spieler hinzufügen</button></section><section class="card"><h2>Datensicherung</h2><button class="wide" onclick="exportData()">JSON-Backup herunterladen</button><label>Backup wiederherstellen</label><input type="file" accept=".json,application/json" onchange="importData(this)"><p class="muted">Diese Version speichert lokal im Browser. Supabase-Login und Cloud-Sync werden erst nach Einrichtung des eigenen Projekts aktiviert.</p></section>'}function render(){const tabs=[['live','● Live'],['matches','▦ Spieltage'],['stats','▥ Statistik'],['settings','⚙ Team']];document.getElementById('nav').innerHTML=tabs.map(([id,n])=>'<button class="'+(tab===id?'sel':'')+'" onclick="tab=\''+id+'\';save();render()">'+n+'</button>').join('');document.getElementById('app').innerHTML=tab==='live'?live():tab==='matches'?matches():tab==='stats'?statistics():settings();if(tab==='live'&&current())renderActions()}render();</script></body></html>
